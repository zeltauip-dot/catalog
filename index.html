<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#285c4d">
  <meta name="description" content="Каталог продукции ИП Желтау">
  <link rel="manifest" href="./manifest.json">
  <title>Каталог ИП Желтау</title>

  <style>
    :root {
      --green:#285c4d;
      --green2:#367963;
      --pale:#edf5f0;
      --yellow:#ffe36a;
      --ink:#23332d;
      --muted:#68776f;
      --line:#e1e9e4;
      --white:#fff;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      background:#f4f7f5;
      color:var(--ink);
      font-family:Arial,Helvetica,sans-serif;
    }

    header {
      background:var(--green);
      color:#fff;
      padding:18px max(16px,calc((100% - 1180px)/2));
      box-shadow:0 2px 8px #0001;
    }

    .brand {
      font-weight:800;
      font-size:23px;
      letter-spacing:.2px;
    }

    .subtitle {
      margin-top:5px;
      color:#e0eee7;
      font-size:14px;
    }

    main {
      max-width:1180px;
      margin:0 auto;
      padding:18px 16px 40px;
    }

    .toolbar {
      display:grid;
      grid-template-columns:1fr auto auto;
      gap:12px;
      margin-bottom:14px;
    }

    input,select {
      font:inherit;
      border:1px solid #d5e0d9;
      border-radius:11px;
      background:#fff;
      padding:12px 13px;
      min-width:0;
      outline-color:var(--green2);
    }

    .refresh-btn {
      border:0;
      border-radius:11px;
      background:var(--green);
      color:#fff;
      padding:12px 16px;
      font:inherit;
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
    }

    .refresh-btn:disabled {
      opacity:.6;
      cursor:wait;
    }

    .territory {
      display:flex;
      gap:8px;
      margin-bottom:13px;
      flex-wrap:wrap;
    }

    .pill,.cat-btn {
      border:1px solid #cddbd2;
      border-radius:999px;
      background:#fff;
      padding:9px 14px;
      font:inherit;
      cursor:pointer;
      color:var(--green);
      font-weight:700;
    }

    .pill.active,.cat-btn.active {
      background:var(--green);
      border-color:var(--green);
      color:#fff;
    }

    .category-list {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:0 0 17px;
    }

    .info {
      font-size:13px;
      color:var(--muted);
      margin:0 0 13px;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:13px;
    }

    .card {
      display:grid;
      grid-template-columns:minmax(110px,34%) 1fr;
      gap:14px;
      padding:13px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:15px;
      box-shadow:0 2px 8px #1c3b2c08;
      min-width:0;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .photo-wrap {
      min-height:150px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f7f9f7;
      border-radius:10px;
      overflow:hidden;
    }

    .photo {
      width:100%;
      height:100%;
      max-height:220px;
      object-fit:contain;
    }

    .placeholder {
      color:#9aa9a0;
      font-size:12px;
      text-align:center;
      padding:12px;
    }

    .details {
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .category {
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.4px;
      color:var(--green2);
      font-weight:800;
    }

    .name {
      font-size:17px;
      line-height:1.25;
      font-weight:800;
      overflow-wrap:anywhere;
    }

    .brandline {
      font-size:13px;
      color:var(--muted);
    }

    .meta {
      font-size:12px;
      color:#53645b;
      line-height:1.45;
      overflow-wrap:anywhere;
    }

    .prices {
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      margin-top:auto;
      padding-top:3px;
    }

    .price-main {
      display:inline-block;
      background:var(--yellow);
      color:#262a1c;
      border-radius:7px;
      padding:8px 10px;
      font-size:18px;
      font-weight:800;
    }

    .price-old {
      font-size:12px;
      color:#8a918d;
      text-decoration:line-through;
    }

    .price-extra {
      font-size:12px;
      color:var(--muted);
      align-self:center;
    }

    .desc {
      font-size:12px;
      color:#53645b;
      line-height:1.4;
      overflow-wrap:anywhere;
    }

    .badge {
      display:inline-block;
      background:#e6f2eb;
      color:var(--green);
      border-radius:5px;
      padding:4px 7px;
      font-size:11px;
      font-weight:800;
      align-self:flex-start;
    }

    .empty,.loading,.error {
      background:#fff;
      border-radius:12px;
      padding:24px;
      text-align:center;
      color:var(--muted);
      grid-column:1/-1;
    }

    .error { color:#8a342e; }

    .foot {
      text-align:center;
      color:#87948d;
      font-size:12px;
      margin-top:22px;
    }

    /* ОКНО ПРОСМОТРА ТОВАРА */

    .viewer {
      position:fixed;
      inset:0;
      z-index:1000;
      background:rgba(13,24,19,.94);
      display:none;
      align-items:center;
      justify-content:center;
      padding:0;
    }

    .viewer.open {
      display:flex;
    }

    .viewer-panel {
      position:relative;
      width:100%;
      height:100dvh;
      max-height:100dvh;
      background:#fff;
      border-radius:0;
      overflow:hidden;
      display:grid;
      grid-template-rows:minmax(0,1fr) minmax(220px,42dvh);
      box-shadow:0 12px 50px #0005;
    }

    .viewer-top {
      position:relative;
      min-height:0;
      background:#f5f7f5;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:55px 65px 15px;
      overflow:hidden;
    }

    .viewer-image {
      display:block;
      max-width:100%;
      max-height:100%;
      width:auto;
      height:auto;
      object-fit:contain;
    }

    .viewer-no-image {
      color:#87948d;
      font-size:18px;
      text-align:center;
    }

    .viewer-close {
      position:absolute;
      top:12px;
      right:14px;
      z-index:2;
      border:0;
      border-radius:50%;
      width:44px;
      height:44px;
      background:#fff;
      color:#23332d;
      font-size:30px;
      line-height:1;
      cursor:pointer;
      box-shadow:0 2px 8px #0002;
    }

    .viewer-nav {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:48px;
      height:58px;
      border:0;
      border-radius:12px;
      background:#ffffffdf;
      color:#23332d;
      font-size:34px;
      cursor:pointer;
      box-shadow:0 2px 8px #0002;
    }

    .viewer-prev { left:12px; }
    .viewer-next { right:12px; }

    .viewer-nav:disabled {
      opacity:.25;
      cursor:default;
    }

    .viewer-counter {
      position:absolute;
      top:18px;
      left:18px;
      background:#ffffffdf;
      border-radius:20px;
      padding:7px 12px;
      font-size:13px;
      font-weight:700;
      color:#23332d;
    }

    .viewer-details {
      min-height:0;
      display:grid;
      grid-template-rows:minmax(0,1fr) auto;
      overflow:hidden;
      padding:12px 22px 12px;
      padding-bottom:max(12px,env(safe-area-inset-bottom));
      background:#fff;
    }

    .viewer-info {
      min-height:0;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      display:flex;
      flex-direction:column;
      gap:7px;
      padding-bottom:8px;
    }

    .viewer-name {
      font-size:22px;
      line-height:1.25;
      font-weight:800;
    }

    .viewer-brand {
      font-size:15px;
      color:var(--muted);
    }

    .viewer-meta {
      font-size:15px;
      line-height:1.4;
      color:#53645b;
      overflow-wrap:anywhere;
    }

    .viewer-desc {
      font-size:14px;
      line-height:1.4;
      color:#53645b;
    }

    .viewer-pricebar {
      border-top:1px solid var(--line);
      padding-top:9px;
      background:#fff;
    }

    .viewer-price {
      font-size:23px;
      font-weight:800;
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .viewer-price .price-main {
      font-size:24px;
    }

    @media(max-width:760px) {
      .grid { grid-template-columns:1fr; }
      .toolbar { grid-template-columns:1fr; }
      .card {
        grid-template-columns:34% 1fr;
        gap:11px;
        padding:10px;
      }
      .photo-wrap { min-height:130px; }
      .name { font-size:15px; }
      .price-main { font-size:17px; }
    }

    @media(min-width:600px) and (max-width:1100px) and (orientation:portrait) {
      main { padding:22px 26px 44px; }
      .grid {
        grid-template-columns:1fr;
        gap:22px;
      }
      .card {
        grid-template-columns:42% 1fr;
        gap:22px;
        padding:22px;
        border-radius:18px;
      }
      .photo-wrap { min-height:280px; }
      .photo { max-height:340px; }
      .details { gap:11px; }
      .name { font-size:24px; line-height:1.4; }
      .price-main { font-size:29px; padding:12px 15px; }
      .meta,.brandline,.desc { font-size:17px; line-height:1.5; }
      .category { font-size:14px; }
      .badge { font-size:14px; padding:6px 9px; }
    }

    @media(min-width:761px) and (max-width:1100px) and (orientation:landscape) {
      .grid { grid-template-columns:1fr; }
      .card { grid-template-columns:34% 1fr; }
    }

    @media(max-width:380px) {
      .card { grid-template-columns:1fr; }
      .photo-wrap { height:180px; }
      .photo { height:180px; }
    }

    @media(max-width:600px) {
      .viewer-panel {
        grid-template-rows:minmax(0,1fr) minmax(210px,44dvh);
      }
      .viewer-top { padding:54px 48px 12px; }
      .viewer-details { padding:10px 16px 10px; }
      .viewer-name { font-size:19px; }
      .viewer-nav {
        width:38px;
        height:48px;
        font-size:28px;
      }
      .viewer-prev { left:6px; }
      .viewer-next { right:6px; }
    }

    @media(orientation:landscape) and (max-height:600px) {
      .viewer-panel {
        grid-template-rows:minmax(0,1fr) minmax(145px,35dvh);
      }
      .viewer-details { padding:7px 18px 7px; }
      .viewer-name { font-size:18px; }
      .viewer-info { gap:4px; }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">ИП Желтау</div>
  <div class="subtitle">Каталог продукции</div>
</header>

<main>

  <div class="territory" aria-label="Территория">
    <button class="pill active" data-territory="all">Все товары</button>
    <button class="pill" data-territory="city">Город</button>
    <button class="pill" data-territory="region">Регион</button>
  </div>

  <div class="toolbar">
    <input id="search" type="search"
      placeholder="Поиск по названию, бренду или штрихкоду…"
      aria-label="Поиск товаров">

    <select id="sort" aria-label="Сортировка">
      <option value="default">Сначала по порядку</option>
      <option value="name">По названию А–Я</option>
      <option value="price">Сначала дешевле</option>
    </select>

    <button id="refreshBtn" class="refresh-btn" type="button">
      ↻ Обновить каталог
    </button>
  </div>

  <div id="categories" class="category-list" aria-label="Категории">
    <button class="cat-btn active" data-category="all">Все категории</button>
  </div>

  <p id="status" class="info">Загрузка каталога…</p>

  <section id="products" class="grid">
    <div class="loading">Загружаем товары…</div>
  </section>

  <div class="foot">
    Каталог ИП Желтау · При подключении к интернету каталог обновляется автоматически
  </div>

</main>

<!-- ОКНО ТОВАРА -->

<div id="viewer" class="viewer" aria-hidden="true">
  <div class="viewer-panel" role="dialog" aria-modal="true" aria-label="Просмотр товара">

    <div id="viewerTop" class="viewer-top">
      <div id="viewerCounter" class="viewer-counter"></div>

      <button id="viewerClose" class="viewer-close" type="button" aria-label="Закрыть">×</button>

      <button id="viewerPrev" class="viewer-nav viewer-prev" type="button" aria-label="Предыдущий товар">‹</button>

      <div id="viewerImageHost" class="viewer-no-image">
        Фото пока не добавлено
      </div>

      <button id="viewerNext" class="viewer-nav viewer-next" type="button" aria-label="Следующий товар">›</button>
    </div>

    <div id="viewerDetails" class="viewer-details"></div>

  </div>
</div>

<script>
(() => {
  'use strict';

  const API_URL = 'https://script.google.com/macros/s/AKfycbwtA8LXvNdYI8C0DHE9SQQjc03_pl5Y2k53gqhHwVEpUZuKe19Mz5yq2xruY4kdUZY/exec';
  const DATA_KEY = 'zheltau-products-v1';

  const $ = id => document.getElementById(id);

  let allProducts = [];
  let visibleProducts = [];
  let viewerIndex = -1;
  let activeCategory = 'all';
  let activeTerritory = 'all';
  let touchStart = null;
  let lastTouchOpen = 0;
  let refreshing = false;

  const norm = value => String(value ?? '').trim();

  const get = (p, ...keys) => {
    for (const key of keys) {
      const wanted = String(key).trim().toLowerCase();
      const foundKey = Object.keys(p || {}).find(
        k => String(k).trim().toLowerCase() === wanted
      );
      if (foundKey !== undefined && norm(p[foundKey])) {
        return norm(p[foundKey]);
      }
    }
    return '';
  };

  const yes = value =>
    ['да','yes','true','1','город','регион'].includes(
      norm(value).toLocaleLowerCase('ru')
    );

  const isActive = p => {
    const status = norm(get(p,'Статус','status')).toLocaleLowerCase('ru');
    return status === 'активен' || status === 'новинка';
  };

  const isNew = p =>
    norm(get(p,'Статус','status')).toLocaleLowerCase('ru') === 'новинка';

  const escapeHTML = value =>
    norm(value).replace(/[&<>"']/g, c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c]));

  const money = value => {
    const s = norm(value);
    if (!s) return '';
    const n = Number(
      s.replace(/\s/g,'').replace(',','.').replace(/[^\d.-]/g,'')
    );
    return Number.isFinite(n) && n !== 0
      ? new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n) + ' ₸'
      : s;
  };

  function formatSavedDate(timestamp) {
    if (!timestamp) return 'дата неизвестна';
    return new Date(timestamp).toLocaleString('ru-RU', {
      day:'2-digit',
      month:'2-digit',
      year:'numeric',
      hour:'2-digit',
      minute:'2-digit'
    });
  }

  function loadJSONP() {
    return new Promise((resolve, reject) => {
      const cb = 'zheltauCallback_' + Date.now();
      const script = document.createElement('script');

      const timer = setTimeout(
        () => finish(new Error('Истекло время ожидания ответа каталога')),
        15000
      );

      function finish(err, data) {
        clearTimeout(timer);
        delete window[cb];
        script.remove();
        err ? reject(err) : resolve(data);
      }

      window[cb] = data => finish(null, data);
      script.onerror = () => finish(new Error('Не удалось подключиться к каталогу'));

      script.src = API_URL + '?callback=' + cb + '&_=' + Date.now();
      document.head.appendChild(script);
    });
  }

  function cacheProducts(products) {
    try {
      localStorage.setItem(
        DATA_KEY,
        JSON.stringify({savedAt:Date.now(), products})
      );
    } catch(e) {}
  }

  function readCache() {
    try {
      const saved = JSON.parse(localStorage.getItem(DATA_KEY) || 'null');
      return saved && Array.isArray(saved.products) ? saved : null;
    } catch(e) {
      return null;
    }
  }

  async function refreshData() {
    if (refreshing) return;

    refreshing = true;
    $('refreshBtn').disabled = true;
    $('refreshBtn').textContent = 'Обновляем…';

    const cached = readCache();

    if (cached) {
      allProducts = cached.products;
      render();
      $('status').textContent =
        'Сохранённая версия от ' + formatSavedDate(cached.savedAt) +
        ' · проверяем обновления…';
    }

    try {
      const data = await loadJSONP();

      if (!Array.isArray(data)) {
        throw new Error('Получен неверный формат данных');
      }

      allProducts = data.filter(
        p => p && Object.values(p).some(v => norm(v))
      );

      cacheProducts(allProducts);
      render();

      const visibleCount = allProducts.filter(isActive).length;
      const saved = readCache();

      $('status').textContent =
        `Активных товаров: ${visibleCount} · обновлено ${formatSavedDate(saved.savedAt)}`;

    } catch(err) {
      const saved = readCache();

      if (cached) {
        $('status').textContent =
          `Офлайн-режим · сохранённая версия от ${formatSavedDate(saved?.savedAt)} · ${allProducts.filter(isActive).length} активных товаров`;
      } else {
        $('status').textContent =
          'Не удалось загрузить каталог. Проверьте подключение к интернету и обновите страницу.';

        $('products').innerHTML =
          '<div class="error">Каталог пока не загружен. При первом открытии необходимо подключение к интернету.</div>';
      }

    } finally {
      refreshing = false;
      $('refreshBtn').disabled = false;
      $('refreshBtn').textContent = '↻ Обновить каталог';
    }
  }

  function imageURL(raw) {
    const url = norm(raw);
    if (!url) return '';

    const idMatch = url.match(/(?:\/d\/|[?&]id=)([a-zA-Z0-9_-]{15,})/);

    if (/drive\.google\.com/.test(url) && idMatch) {
      return 'https://drive.google.com/uc?export=view&id=' + idMatch[1];
    }

    return url;
  }

  function renderCategories(products) {
    const categories = [
      ...new Set(
        products
          .filter(isActive)
          .map(p => get(p,'Категория','category'))
          .filter(Boolean)
      )
    ].sort((a,b) => a.localeCompare(b,'ru'));

    const host = $('categories');
    const previousCategory = activeCategory;

    host.innerHTML = '';

    const addButton = (label, value) => {
      const b = document.createElement('button');

      b.className = 'cat-btn' +
        (activeCategory === value ? ' active' : '');

      b.textContent = label;
      b.dataset.category = value;

      b.addEventListener('click', () => {
        activeCategory = value;
        render();
      });

      host.appendChild(b);
    };

    addButton('Все категории','all');
    categories.forEach(c => addButton(c,c));

    if (previousCategory !== 'all' && !categories.includes(previousCategory)) {
      activeCategory = 'all';
    }

    [...host.querySelectorAll('[data-category]')].forEach(b => {
      b.classList.toggle('active', b.dataset.category === activeCategory);
    });
  }

  function cardHTML(p, index) {
    const name = get(p,'Наименование','Название','name') || 'Без названия';
    const brand = get(p,'Бренд','brand');
    const category = get(p,'Категория','category');
    const packaging = get(p,'Фасовка','Упаковка','packaging');
    const barcode = get(p,'Штрихкод','barcode');
    const quantity = get(p,'В коробе','Количество в коробе','quantity per box');
    const price = get(p,'Цена','price');
    const oldPrice = get(p,'Старая цена','Цена старая','old price');
    const boxPrice = get(p,'Цена за коробку','Цена коробки','box price');
    const kgPrice = get(p,'Цена за кг','Цена за килограмм','kg price');
    const desc = get(p,'Описание','description');
    const img = imageURL(get(p,'Фото','Изображение','photo','image'));

    return `
      <article class="card"
        data-product-index="${index}"
        tabindex="0"
        role="button"
        aria-label="Открыть товар: ${escapeHTML(name)}">

        <div class="photo-wrap">
          ${img
            ? `<img class="photo" src="${escapeHTML(img)}"
                alt="${escapeHTML(name)}"
                loading="lazy"
                onerror="this.remove();this.parentElement.innerHTML='<div class=\\'placeholder\\'>Фото пока не добавлено</div>'">`
            : '<div class="placeholder">Фото пока не добавлено</div>'}
        </div>

        <div class="details">
          ${category ? `<div class="category">${escapeHTML(category)}</div>` : ''}
          <div class="name">${escapeHTML(name)}</div>
          ${brand ? `<div class="brandline">${escapeHTML(brand)}</div>` : ''}
          ${isNew(p) ? '<span class="badge">НОВИНКА</span>' : ''}
          ${packaging ? `<div class="meta">Фасовка: ${escapeHTML(packaging)}</div>` : ''}
          ${barcode ? `<div class="meta">Штрихкод: ${escapeHTML(barcode)}</div>` : ''}
          ${quantity ? `<div class="meta">В коробе: ${escapeHTML(quantity)} шт.</div>` : ''}
          ${desc ? `<div class="desc">${escapeHTML(desc)}</div>` : ''}

          <div class="prices">
            ${oldPrice ? `<span class="price-old">${escapeHTML(money(oldPrice))}</span>` : ''}
            ${price ? `<span class="price-main">${escapeHTML(money(price))}</span>` : ''}
            ${boxPrice ? `<span class="price-extra">Короб: ${escapeHTML(money(boxPrice))}</span>` : ''}
            ${kgPrice ? `<span class="price-extra">За кг: ${escapeHTML(money(kgPrice))}</span>` : ''}
          </div>
        </div>
      </article>
    `;
  }

  function render() {
    const activeProducts = allProducts.filter(isActive);

    renderCategories(activeProducts);

    const q = $('search').value.trim().toLocaleLowerCase('ru');

    let list = activeProducts.filter(p => {
      const text = [
        get(p,'Наименование','Название'),
        get(p,'Бренд'),
        get(p,'Штрихкод'),
        get(p,'Код'),
        get(p,'Описание')
      ].join(' ').toLocaleLowerCase('ru');

      const cat = get(p,'Категория');
      const city = get(p,'Город');
      const region = get(p,'Регион');

      const territoryOK =
        activeTerritory === 'all' ||
        (activeTerritory === 'city' && yes(city)) ||
        (activeTerritory === 'region' && yes(region));

      return (!q || text.includes(q)) &&
        (activeCategory === 'all' || cat === activeCategory) &&
        territoryOK;
    });

    const sort = $('sort').value;

    if (sort === 'name') {
      list.sort((a,b) =>
        get(a,'Наименование').localeCompare(get(b,'Наименование'),'ru')
      );
    }

    if (sort === 'price') {
      list.sort((a,b) => {
        const n = x =>
          Number(
            get(x,'Цена')
              .replace(/\s/g,'')
              .replace(',','.')
              .replace(/[^\d.-]/g,'')
          ) || Infinity;

        return n(a)-n(b);
      });
    }

    visibleProducts = list;

    $('products').innerHTML = list.length
      ? list.map((p,i) => cardHTML(p,i)).join('')
      : '<div class="empty">По выбранным условиям товары не найдены.</div>';

    if ($('viewer').classList.contains('open') &&
        viewerIndex >= visibleProducts.length) {
      closeViewer();
    }
  }

  function viewerDetailsHTML(p) {
    const name = get(p,'Наименование','Название','name') || 'Без названия';
    const brand = get(p,'Бренд','brand');
    const category = get(p,'Категория','category');
    const packaging = get(p,'Фасовка','Упаковка','packaging');
    const barcode = get(p,'Штрихкод','barcode');
    const quantity = get(p,'В коробе','Количество в коробе','quantity per box');
    const desc = get(p,'Описание','description');
    const price = get(p,'Цена','price');
    const oldPrice = get(p,'Старая цена','Цена старая','old price');
    const boxPrice = get(p,'Цена за коробку','Цена коробки','box price');
    const kgPrice = get(p,'Цена за кг','Цена за килограмм','kg price');

    return `
      <div class="viewer-info">
        ${category ? `<div class="category">${escapeHTML(category)}</div>` : ''}
        <div class="viewer-name">${escapeHTML(name)}</div>
        ${brand ? `<div class="viewer-brand">${escapeHTML(brand)}</div>` : ''}
        ${isNew(p) ? '<span class="badge">НОВИНКА</span>' : ''}
        ${packaging ? `<div class="viewer-meta">Фасовка: ${escapeHTML(packaging)}</div>` : ''}
        ${barcode ? `<div class="viewer-meta">Штрихкод: ${escapeHTML(barcode)}</div>` : ''}
        ${quantity ? `<div class="viewer-meta">В коробе: ${escapeHTML(quantity)} шт.</div>` : ''}
        ${desc ? `<div class="viewer-desc">${escapeHTML(desc)}</div>` : ''}
      </div>

      <div class="viewer-pricebar">
        <div class="viewer-price">
          ${oldPrice ? `<span class="price-old">${escapeHTML(money(oldPrice))}</span>` : ''}
          ${price ? `<span class="price-main">${escapeHTML(money(price))}</span>` : ''}
          ${boxPrice ? `<span class="price-extra">Короб: ${escapeHTML(money(boxPrice))}</span>` : ''}
          ${kgPrice ? `<span class="price-extra">За кг: ${escapeHTML(money(kgPrice))}</span>` : ''}
        </div>
      </div>
    `;
  }

  function showViewerProduct() {
    const p = visibleProducts[viewerIndex];
    if (!p) return;

    const img = imageURL(get(p,'Фото','Изображение','photo','image'));

    $('viewerImageHost').innerHTML = img
      ? `<img class="viewer-image"
          src="${escapeHTML(img)}"
          alt="${escapeHTML(get(p,'Наименование','Название','name'))}"
          onerror="this.remove();document.getElementById('viewerImageHost').textContent='Фото пока не добавлено'">`
      : 'Фото пока не добавлено';

    $('viewerDetails').innerHTML = viewerDetailsHTML(p);
    $('viewerDetails').scrollTop = 0;

    $('viewerCounter').textContent =
      `${viewerIndex+1} из ${visibleProducts.length}`;

    $('viewerPrev').disabled = viewerIndex === 0;
    $('viewerNext').disabled = viewerIndex === visibleProducts.length-1;
  }

  function openViewer(index) {
    if (index < 0 || index >= visibleProducts.length) return;

    viewerIndex = index;
    showViewerProduct();

    $('viewer').classList.add('open');
    $('viewer').setAttribute('aria-hidden','false');

    document.body.style.overflow = 'hidden';
  }

  function closeViewer() {
    $('viewer').classList.remove('open');
    $('viewer').setAttribute('aria-hidden','true');

    document.body.style.overflow = '';
    viewerIndex = -1;
  }

  function moveViewer(step) {
    const next = viewerIndex + step;

    if (next >= 0 && next < visibleProducts.length) {
      viewerIndex = next;
      showViewerProduct();
    }
  }

  /* ОТКРЫТИЕ КАРТОЧЕК НА ПЛАНШЕТЕ И КОМПЬЮТЕРЕ */

  $('products').addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;

    const card = e.target.closest('.card[data-product-index]');
    if (!card) return;

    touchStart = {
      card,
      x:e.clientX,
      y:e.clientY
    };
  });

  $('products').addEventListener('pointerup', e => {
    if (!touchStart) return;

    const card = e.target.closest('.card[data-product-index]');
    const dx = e.clientX - touchStart.x;
    const dy = e.clientY - touchStart.y;

    if (card === touchStart.card && Math.abs(dx) < 15 && Math.abs(dy) < 15) {
      lastTouchOpen = Date.now();
      openViewer(Number(card.dataset.productIndex));
    }

    touchStart = null;
  });

  $('products').addEventListener('pointercancel', () => {
    touchStart = null;
  });

  $('products').addEventListener('click', e => {
    if (Date.now() - lastTouchOpen < 800) return;

    const card = e.target.closest('.card[data-product-index]');
    if (card) {
      openViewer(Number(card.dataset.productIndex));
    }
  });

  $('products').addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') &&
        e.target.matches('.card[data-product-index]')) {
      e.preventDefault();
      openViewer(Number(e.target.dataset.productIndex));
    }
  });

  $('viewerClose').addEventListener('click', closeViewer);
  $('viewerPrev').addEventListener('click', () => moveViewer(-1));
  $('viewerNext').addEventListener('click', () => moveViewer(1));

  $('viewer').addEventListener('click', e => {
    if (e.target === $('viewer')) closeViewer();
  });

  document.addEventListener('keydown', e => {
    if (!$('viewer').classList.contains('open')) return;

    if (e.key === 'Escape') closeViewer();
    if (e.key === 'ArrowLeft') moveViewer(-1);
    if (e.key === 'ArrowRight') moveViewer(1);
  });

  /* СВАЙП МЕЖДУ ТОВАРАМИ */

  let swipeStartX = 0;
  let swipeStartY = 0;

  $('viewerTop').addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      swipeStartX = e.touches[0].clientX;
      swipeStartY = e.touches[0].clientY;
    }
  }, {passive:true});

  $('viewerTop').addEventListener('touchend', e => {
    if (!swipeStartX) return;

    const dx = e.changedTouches[0].clientX - swipeStartX;
    const dy = e.changedTouches[0].clientY - swipeStartY;

    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      moveViewer(dx < 0 ? 1 : -1);
    }

    swipeStartX = 0;
    swipeStartY = 0;
  }, {passive:true});

  /* ПОИСК, СОРТИРОВКА И ТЕРРИТОРИЯ */

  $('search').addEventListener('input', render);
  $('sort').addEventListener('change', render);

  document.querySelectorAll('[data-territory]').forEach(b => {
    b.addEventListener('click', () => {
      activeTerritory = b.dataset.territory;

      document.querySelectorAll('[data-territory]').forEach(x => {
        x.classList.toggle('active', x === b);
      });

      render();
    });
  });

  /* РУЧНОЕ И АВТОМАТИЧЕСКОЕ ОБНОВЛЕНИЕ */

  $('refreshBtn').addEventListener('click', refreshData);

  if ('serviceWorker' in navigator &&
      location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  refreshData();

  setInterval(() => {
    if (navigator.onLine) refreshData();
  }, 60 * 60 * 1000);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && navigator.onLine) {
      refreshData();
    }
  });

  window.addEventListener('online', refreshData);

})();
</script>

</body>
</html>
